<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡БЫСТРЫЙ РЕСПАВН | ЧИТЕРСКИЙ БИНД | BIND ⚡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }

        /* Анимированный фон */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 136, 255, 0.1) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            width: 100%;
        }

        /* Главный заголовок */
        .main-title {
            font-size: clamp(28px, 5vw, 52px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00ff88, #00aaff, #00ff88);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            line-height: 1.2;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Подзаголовок */
        .subtitle {
            font-size: clamp(18px, 3vw, 28px);
            color: #e0e0e0;
            margin-bottom: 40px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .subtitle span {
            color: #00ff88;
        }

        /* Блок с кодом */
        .code-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 16px;
            padding: 25px 30px;
            margin: 0 auto 30px;
            max-width: 600px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.2),
                inset 0 0 20px rgba(0, 255, 136, 0.05);
            transition: all 0.3s ease;
        }

        .code-box:hover {
            border-color: rgba(0, 255, 136, 0.6);
            box-shadow: 
                0 0 30px rgba(0, 255, 136, 0.3),
                inset 0 0 30px rgba(0, 255, 136, 0.1);
            transform: translateY(-2px);
        }

        .code-label {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #00ff88, #00aaff);
            color: #000;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .code-content {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(14px, 2.5vw, 18px);
            color: #00ff88;
            word-break: break-all;
            line-height: 1.6;
            padding: 10px 0;
            user-select: all;
        }

        /* Кнопка копирования */
        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            color: #000;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
            margin-top: 10px;
        }

        .copy-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0, 255, 136, 0.5);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copy-btn.copied {
            background: linear-gradient(90deg, #00aaff, #0088cc);
            box-shadow: 0 4px 15px rgba(0, 170, 255, 0.3);
        }

        /* Иконка копирования */
        .copy-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Уведомление */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 255, 136, 0.9);
            color: #000;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Декоративные элементы */
        .decoration {
            position: fixed;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
        }

        .decoration-1 {
            top: -100px;
            left: -100px;
            background: #00ff88;
        }

        .decoration-2 {
            bottom: -100px;
            right: -100px;
            background: #00aaff;
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            .container {
                padding: 30px 15px;
            }

            .code-box {
                padding: 20px 15px;
            }

            .copy-btn {
                padding: 12px 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Декоративные элементы фона -->
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div class="container">
        <!-- Главный заголовок -->
        <h1 class="main-title">⚡БЫСТРЫЙ РЕСПАВН<br>ЧИТЕРСКИЙ БИНД</h1>

        <!-- Подзаголовок -->
        <p class="subtitle">Спасибо за <span>покупку</span>!</p>

        <!-- Блок с кодом для копирования -->
        <div class="code-box">
            <div class="code-label">Твой бинд</div>
            <div class="code-content" id="bindCode">
                <!-- ЗАМЕНИ ЭТОТ ТЕКСТ НА СВОЙ БИНД -->
                bind [rightshift+l] "kill;respawn_sleepingbag id"
            </div>
        </div>

        <!-- Кнопка копирования -->
        <button class="copy-btn" id="copyBtn" onclick="copyCode()">
            <svg class="copy-icon" viewBox="0 0 24 24">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
            </svg>
            Скопировать
        </button>
    </div>

    <!-- Уведомление о копировании -->
    <div class="toast" id="toast">✅ Бинд скопирован!</div>

    <script>
        function copyCode() {
            const code = document.getElementById('bindCode').innerText.trim();
            const btn = document.getElementById('copyBtn');
            const toast = document.getElementById('toast');

            // Копирование в буфер обмена
            navigator.clipboard.writeText(code).then(() => {
                // Меняем текст кнопки
                btn.classList.add('copied');
                btn.innerHTML = `
                    <svg class="copy-icon" viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                    Скопировано!
                `;

                // Показываем уведомление
                toast.classList.add('show');

                // Возвращаем всё обратно через 2 секунды
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = `
                        <svg class="copy-icon" viewBox="0 0 24 24">
                            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                        </svg>
                        Скопировать
                    `;
                    toast.classList.remove('show');
                }, 2000);
            }).catch(err => {
                // Fallback для старых браузеров
                const textArea = document.createElement('textarea');
                textArea.value = code;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);

                toast.textContent = '✅ Бинд скопирован!';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        // Копирование по клику на блок с кодом
        document.getElementById('bindCode').addEventListener('click', copyCode);
    </script>
</body>
</html>
